name: Build and Test

permissions:
  contents: read
  pull-requests: write
  packages: read
  id-token: write

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

jobs:

  build-test:
    uses: liquibase/build-logic/.github/workflows/os-extension-test.yml@techops-1492-fork-pr-no-vault
    secrets: inherit
    with:
      java: '[17, 21]'
      os: '["ubuntu-latest"]'

  hibernate-test:
    name: Test Hibernate ${{ matrix.hibernate }}
    needs: build-test
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        hibernate: ["7.1.16.Final", "7.2.4.Final"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 17
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Compatibility Tests
        run: mvn -B clean test -Dhibernate.version=${{ matrix.hibernate }} verify

      - name: Run Tests
        run: mvn -B clean test verify

      - name: Archive Test Results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-hibernate-${{ matrix.hibernate }}
          path: |
            **/target/surefire-reports
            **/target/jacoco.exec
